<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Northwest Cafeteria TV</title>

<style>
html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #000;
}

video {
  position: fixed;
  top: 0;
  left: 0;
  width: 100vw;
  height: 100vh;
  object-fit: contain;
  background: #000;
}

* {
  cursor: none !important;
}
</style>
</head>

<body>

<video
  id="cafeteriaTV"
  autoplay
  muted
  loop
  playsinline
  preload="auto">
  <source src="./Cafeteria_Channel_GitHub.mp4?v=oct2026" type="video/mp4">
</video>

<script>
const video = document.getElementById("cafeteriaTV");
let wakeLock = null;

/* Make absolutely sure video starts */
function startVideo() {
  video.muted = true;
  video.play().catch(function() {});
}

startVideo();

/* Restart if browser ever pauses it */
video.addEventListener("pause", function() {
  startVideo();
});

/* Keep cafeteria display awake */
async function keepAwake() {
  try {
    if ("wakeLock" in navigator) {
      wakeLock = await navigator.wakeLock.request("screen");
    }
  } catch (e) {}
}

keepAwake();

document.addEventListener("visibilitychange", function() {
  if (document.visibilityState === "visible") {
    keepAwake();
    startVideo();
  }
});

/* Reload every hour to keep things fresh */
setTimeout(function() {
  location.reload();
}, 60 * 60 * 1000);
</script>

</body>
</html>
