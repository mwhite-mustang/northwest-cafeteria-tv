<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Northwest Cafeteria TV</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000}
#screen{position:fixed;inset:0;width:100vw;height:100vh;object-fit:contain;background:#000}
*{cursor:none!important}
</style>
</head>
<body>
<img id="screen" alt="Northwest Cafeteria TV">
<script>
const slides = Array.from({length:38},(_,i)=>`/slide-${String(i+1).padStart(2,'0')}.jpg`);
const delay = 7000;
let i=0, wakeLock=null;
const screen=document.getElementById('screen');
function show(){ screen.src=slides[i]+'?v=oct2026'; i=(i+1)%slides.length; }
slides.forEach(src=>{const im=new Image(); im.src=src;});
show(); setInterval(show,delay);
async function keepAwake(){try{if('wakeLock' in navigator) wakeLock=await navigator.wakeLock.request('screen')}catch(e){}}
keepAwake();
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible') keepAwake();});
setTimeout(()=>location.reload(),60*60*1000);
</script>
</body>
</html>
